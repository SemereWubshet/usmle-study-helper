name: Build Linux Release Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller fastapi uvicorn pydantic

      - name: Provision SSL Certificates from Secrets
        env:
          SSL_CERT: ${{ secrets.SSL_CERT }}
          SSL_KEY: ${{ secrets.SSL_KEY }}
        run: |
          mkdir -p src/backend/certs
          echo "$SSL_CERT" > src/backend/certs/cert.pem
          echo "$SSL_KEY" > src/backend/certs/key.pem

      - name: Build Executable with PyInstaller
        run: |
          cd src/backend
          pyinstaller usmle_engine.spec --clean --noconfirm

      - name: Assemble Portable Package Folder
        run: |
          # Create clean portable staging directory
          mkdir -p package/USMLEStudyHelper/certs
          mkdir -p package/USMLEStudyHelper/datasets
          mkdir -p package/USMLEStudyHelper/profile

          # Copy compiled binary folder
          cp -r src/backend/dist/USMLEStudyHelper/* package/USMLEStudyHelper/
          
          # Ensure execution permissions on Linux binary
          chmod +x package/USMLEStudyHelper/USMLE-Helper

          # Copy certificates and datasets
          cp src/backend/certs/*.pem package/USMLEStudyHelper/certs/
          cp src/backend/datasets/*.db package/USMLEStudyHelper/datasets/

          # Package into tar.gz and zip
          cd package
          tar -czvf ../USMLEStudyHelper-Linux.tar.gz USMLEStudyHelper
          zip -r ../USMLEStudyHelper-Linux.zip USMLEStudyHelper

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: USMLEStudyHelper-Linux
          path: USMLEStudyHelper-Linux.tar.gz

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            USMLEStudyHelper-Linux.tar.gz
            USMLEStudyHelper-Linux.zip
          draft: false
          prerelease: false
          generate_release_notes: true
