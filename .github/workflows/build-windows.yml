name: Build Windows Release Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Allows triggering the build manually from GitHub Actions UI
    inputs:
      test_version:
        description: 'Optional version override (e.g. 1.2.1)'
        required: false
        type: string
      prerelease_tag:
        description: 'Optional hidden pre-release tag to publish (e.g. v1.2.1-test)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller fastapi uvicorn pydantic httpx networkx

      - name: Provision SSL Certificates from Secrets
        shell: bash
        env:
          SSL_CERT: ${{ secrets.SSL_CERT }}
          SSL_KEY: ${{ secrets.SSL_KEY }}
        run: |
          mkdir -p src/backend/certs
          echo "$SSL_CERT" > src/backend/certs/cert.pem
          echo "$SSL_KEY" > src/backend/certs/key.pem

      - name: Override Engine Version (Optional Test Build)
        if: ${{ inputs.test_version != '' }}
        shell: bash
        env:
          TEST_VERSION: ${{ inputs.test_version }}
        run: |
          sed -i "s/^APP_VERSION = .*/APP_VERSION = \"${TEST_VERSION}\"/" src/backend/app/core/config.py
          grep "^APP_VERSION" src/backend/app/core/config.py

      - name: Build Executable with PyInstaller
        shell: bash
        run: |
          cd src/backend
          pyinstaller usmle_engine.spec --clean --noconfirm

      - name: Assemble Portable Package Folder
        shell: bash
        run: |
          # Create clean portable staging folder
          mkdir -p package/USMLEStudyHelper/certs
          mkdir -p package/USMLEStudyHelper/datasets
          mkdir -p package/USMLEStudyHelper/graphdata
          mkdir -p package/USMLEStudyHelper/profile

          # Copy the standalone --onefile PyInstaller binary
          cp src/backend/dist/USMLE-Helper.exe package/USMLEStudyHelper/USMLE-Helper.exe
          cp src/backend/dist/USMLE-Helper.exe ./USMLE-Helper.exe
          
          # Copy certificates, datasets, and clinical knowledge graph into the package
          cp src/backend/certs/*.pem package/USMLEStudyHelper/certs/
          cp src/backend/datasets/*.db package/USMLEStudyHelper/datasets/
          cp -r src/backend/graphdata/* package/USMLEStudyHelper/graphdata/

          # Provide placeholder api_key.txt template
          echo "# Paste OpenRouter API key here: OPENROUTER_API_KEY=sk-or-v1-..." > package/USMLEStudyHelper/api_key.txt

          # Zip the portable folder
          cd package
          7z a -tzip ../USMLEStudyHelper-Windows.zip USMLEStudyHelper

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: USMLEStudyHelper-Windows
          path: |
            USMLEStudyHelper-Windows.zip
            USMLE-Helper.exe

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || inputs.prerelease_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.prerelease_tag != '' && inputs.prerelease_tag || github.ref_name }}
          files: |
            USMLEStudyHelper-Windows.zip
            USMLE-Helper.exe
          draft: false
          prerelease: ${{ inputs.prerelease_tag != '' }}
          generate_release_notes: true
